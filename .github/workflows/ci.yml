name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PersonalVault.sln --locked-mode

      - name: Build
        run: dotnet build PersonalVault.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test PersonalVault.sln --configuration Release --no-build --no-restore --verbosity normal
